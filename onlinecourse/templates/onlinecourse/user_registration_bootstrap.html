<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Sign up</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 mb-4">
  <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course</a>
  <div class="text-white">
    {% if user.is_authenticated %}
      Hello, <b>{{ user.username }}</b>
      <a class="btn btn-outline-light btn-sm ms-2" href="{% url 'onlinecourse:logout' %}">Logout</a>
    {% else %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:login' %}">Login</a>
      <a class="btn btn-primary btn-sm" href="{% url 'onlinecourse:registration' %}">Sign up</a>
    {% endif %}
  </div>
</nav>
<div class="container" style="max-width:420px">
  <h3>Sign up</h3>
  {% for m in messages %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}
  <form method="post">
    {% csrf_token %}
    <input class="form-control mb-2" name="username" placeholder="Username" required>
    <input class="form-control mb-3" type="password" name="psw" placeholder="Password" required>
    <button class="btn btn-primary" type="submit">Sign up</button>
  </form>
</div>
</body></html>
